<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>URL History</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">URL Shortener History</span>
            <a href="/" class="btn btn-outline-light btn-sm">Back to Home</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Your Shortened URLs</h3>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Original URL</th>
                                <th scope="col">Shortened URL</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for url in urls %}
                            <tr>
                                <th scope="row">{{ loop.index }}</th>
                                <td class="text-truncate" style="max-width: 300px;">
                                    <a href="{{ url.original_url }}" target="_blank">{{ url.original_url }}</a>
                                </td>
                                <td>
                                    <code>{{ request.host_url }}{{ url.short_code }}</code>
                                </td>
                                <td>
                                    <a href="{{ request.host_url }}{{ url.short_code }}" 
                                       target="_blank" 
                                       class="btn btn-sm btn-outline-primary">Visit</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">No URLs shortened yet.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
