<!DOCTYPE html>
<html lang="en">
    <head>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <title>URL Shortener</title>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show"
                role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"
                    aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <h2 class="text-center">Simple URL Shortener</h2>
            <form method="POST" class="mt-4">
                <div class="input-group mb-3">
                    <input type="text" name="url" class="form-control"
                        placeholder="Paste long URL here..." required>
                    <button class="btn btn-primary"
                        type="submit">Shorten</button>
                </div>
            </form>

            {% if short_url %}
            <div class="alert alert-success mt-3">
                <p>Shortened URL:</p>
                <div class="input-group">
                    <input type="text" id="shortUrl" class="form-control"
                        value="{{ short_url }}" readonly>
                    <button class="btn btn-outline-secondary"
                        onclick="copyText()">Copy</button>
                </div>
            </div>
            {% endif %}

            <a href="/history" class="btn btn-link">View History</a>
        </div>

        <script>
        function copyText() {
            var copyText = document.getElementById("shortUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Copied to clipboard!");
        }
    </script>
    </body>
</html>
